<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" role="img" aria-label="Motor third-party sticker flow: enter plate, approve on Mobile Money, sticker issued, in under 120 seconds" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .title { fill: #f0f6fc; font-size: 17px; font-weight: 600; }
    .sub { fill: #94a3b8; font-size: 13px; }
    .label { fill: #cbd5e1; font-size: 14px; text-anchor: middle; }
    .timer { fill: #4ade80; font-size: 15px; font-weight: 700; text-anchor: end; }

    .s1, .s2, .s3 { opacity: .22; }
    .s1 { animation: s1 9s infinite; }
    .s2 { animation: s2 9s infinite; }
    .s3 { animation: s3 9s infinite; transform-origin: 670px 118px; transform-box: view-box; }

    .track { stroke: #1f2d27; stroke-width: 4; stroke-linecap: round; }
    .line { stroke: #4ade80; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 150; stroke-dashoffset: 150; }
    .l1 { animation: l1 9s infinite; }
    .l2 { animation: l2 9s infinite; }

    .pulse { animation: pulse 9s infinite; transform-origin: 400px 128px; transform-box: view-box; }

    @keyframes s1 { 0%{opacity:.22} 6%,90%{opacity:1} 97%,100%{opacity:.22} }
    @keyframes l1 { 0%,10%{stroke-dashoffset:150} 28%,90%{stroke-dashoffset:0} 97%,100%{stroke-dashoffset:150} }
    @keyframes s2 { 0%,28%{opacity:.22} 34%,90%{opacity:1} 97%,100%{opacity:.22} }
    @keyframes pulse { 0%,36%{transform:scale(1)} 40%{transform:scale(1.12)} 44%{transform:scale(1)} 48%{transform:scale(1.12)} 52%,100%{transform:scale(1)} }
    @keyframes l2 { 0%,52%{stroke-dashoffset:150} 68%,90%{stroke-dashoffset:0} 97%,100%{stroke-dashoffset:150} }
    @keyframes s3 { 0%,68%{opacity:.22;transform:scale(1)} 72%{opacity:1;transform:scale(1.18)} 76%,90%{opacity:1;transform:scale(1)} 97%,100%{opacity:.22;transform:scale(1)} }

    @media (prefers-reduced-motion: reduce) {
      .s1, .s2, .s3 { animation: none; opacity: 1; }
      .line { animation: none; stroke-dashoffset: 0; }
      .pulse { animation: none; }
    }
  </style>

  <rect x="1" y="1" width="798" height="228" rx="16" fill="#0d1117" stroke="#1f3a2a" stroke-width="2"/>

  <text x="32" y="38" class="title">Motor third-party sticker, fully digital</text>
  <text x="32" y="58" class="sub">MUA Insurance Uganda · GroundUp 26 award</text>
  <text x="768" y="40" class="timer">under 120 seconds</text>

  <!-- connectors -->
  <line x1="222" y1="118" x2="358" y2="118" class="track"/>
  <line x1="442" y1="118" x2="608" y2="118" class="track"/>
  <line x1="222" y1="118" x2="358" y2="118" class="line l1"/>
  <line x1="442" y1="118" x2="608" y2="118" class="line l2"/>

  <!-- stage 1: number plate -->
  <g class="s1">
    <rect x="58" y="92" width="152" height="52" rx="6" fill="#f8fafc" stroke="#4ade80" stroke-width="2"/>
    <rect x="64" y="98" width="140" height="40" rx="3" fill="none" stroke="#0d1117" stroke-width="1.5"/>
    <text x="134" y="126" text-anchor="middle" style="font-size:22px;font-weight:800;letter-spacing:2px;fill:#0d1117">UAX 482K</text>
    <text x="134" y="190" class="label">Enter plate</text>
  </g>

  <!-- stage 2: phone with MoMo approval -->
  <g class="s2">
    <rect x="370" y="70" width="60" height="98" rx="10" fill="#111827" stroke="#4ade80" stroke-width="2"/>
    <rect x="378" y="82" width="44" height="12" rx="3" fill="#FFCC00"/>
    <rect x="378" y="100" width="44" height="4" rx="2" fill="#334155"/>
    <rect x="378" y="108" width="30" height="4" rx="2" fill="#334155"/>
    <g class="pulse">
      <rect x="380" y="120" width="40" height="16" rx="8" fill="#4ade80"/>
      <text x="400" y="132" text-anchor="middle" style="font-size:9px;font-weight:700;fill:#0d1117">Approve</text>
    </g>
    <text x="400" y="190" class="label">Approve on Mobile Money</text>
  </g>

  <!-- stage 3: sticker -->
  <g class="s3">
    <circle cx="670" cy="118" r="46" fill="#4ade80"/>
    <circle cx="670" cy="118" r="38" fill="none" stroke="#0d1117" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M650 118 l13 13 l25 -27" fill="none" stroke="#0d1117" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="670" y="190" class="label">Sticker issued</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
